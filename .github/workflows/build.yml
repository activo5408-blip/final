name: Compilar ChatLAN para Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Instalar dependencias de React/Tauri
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Compilar frontend
        run: npm run build

      - name: Compilar instalador Tauri
        run: npm run tauri build

      - name: Subir instalador ChatLAN
        uses: actions/upload-artifact@v4
        with:
          name: ChatLAN-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Subir ejecutable portable
        uses: actions/upload-artifact@v4
        with:
          name: ChatLAN-Windows-Portable
          path: src-tauri/target/release/chatlan.exe
          if-no-files-found: error
          retention-days: 14
